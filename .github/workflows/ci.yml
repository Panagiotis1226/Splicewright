name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: SWCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
      - run: swift test --package-path Packages/SplicewrightKit

  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    env:
      SWIFTLINT_VERSION: 0.65.1
    steps:
      - uses: actions/checkout@v5
      # The release binary plus the runner's preinstalled Swift toolchain (for sourcekitd);
      # no container pull, so a ghcr.io outage can't fail the job.
      - name: Install SwiftLint
        run: |
          curl -fsSL --retry 4 -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          unzip -q /tmp/swiftlint.zip -d /tmp/swiftlint
          lib=$(find /usr/share/swift /usr/lib /opt -name libsourcekitdInProc.so -print -quit 2>/dev/null || true)
          if [ -z "$lib" ]; then echo "::error::libsourcekitdInProc.so not found on runner"; exit 1; fi
          echo "LINUX_SOURCEKIT_LIB_PATH=$(dirname "$lib")" >> "$GITHUB_ENV"
          echo "/tmp/swiftlint" >> "$GITHUB_PATH"
      - run: swiftlint lint --strict --reporter github-actions-logging

  macos:
    name: Build & test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Xcode project matches project.yml
        run: make check-project
      - name: Build app
        run: make build
      - name: Unit tests
        run: make test
        timeout-minutes: 15
        env:
          NSUnbufferedIO: "YES"
      - name: App smoke test
        run: make smoke
      - name: Package .dmg
        run: |
          make dmg
          codesign -dv --verbose=2 build/DerivedData/Build/Products/Release/Splicewright.app
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Splicewright-${{ env.SHORT_SHA }}
          path: build/Splicewright.dmg
          if-no-files-found: error
      - name: Upload smoke-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: build/smoke
          if-no-files-found: ignore
