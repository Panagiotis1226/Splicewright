name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: SWCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
      - run: swift test --package-path Packages/SplicewrightKit

  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - uses: actions/checkout@v5
      - run: swiftlint lint --strict --reporter github-actions-logging

  macos:
    name: Build & test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Xcode project matches project.yml
        run: make check-project
      - name: Build app
        run: make build
      - name: Unit tests
        run: make test
      - name: App smoke test
        run: make smoke
      - name: Package .dmg
        run: |
          make dmg
          codesign -dv --verbose=2 build/DerivedData/Build/Products/Release/Splicewright.app
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Splicewright-${{ env.SHORT_SHA }}
          path: build/Splicewright.dmg
          if-no-files-found: error
      - name: Upload smoke-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: build/smoke
          if-no-files-found: ignore
